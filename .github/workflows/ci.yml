name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    web:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # the same checks as the pre-commit hook (lefthook.yml), on every file.
            # The art packs are licensed and not in the repo, so CI checks code only (no asset copy).
            - run: npx lefthook run pre-commit --all-files --tag web

    rust:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            # tauri's build script expects the frontend dist folder to exist
            - run: mkdir -p dist
            - run: npx lefthook run pre-commit --all-files --tag rust
