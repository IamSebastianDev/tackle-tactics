name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    web:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # the art packs are licensed and not in the repo, so CI checks code only (no asset copy)
            - run: npm run check

    rust:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            # tauri's build script expects the frontend dist folder to exist
            - run: mkdir -p dist
            - run: npm run rust:check
